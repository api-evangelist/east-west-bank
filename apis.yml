apis:
- aid: east-west-bank:bridge-open-banking-api
  name: East West Bank Bridge Open Banking API
  description: East West Bank's first-party commercial banking API program, delivered through
    the "Bridge Open Banking" developer portal for Global Transaction Services (GTS) clients.
    Documented capabilities let applications manage sub-accounts, retrieve account balances,
    transfer funds, and securely obtain information on commercial accounts. Developers create
    an application to obtain a single authentication credential and test against a sandbox of
    live test accounts and test payments. The program is early-stage and access is gated
    behind sales onboarding, so specifications are not publicly downloadable.
