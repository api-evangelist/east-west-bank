name: East West Bank
kind: company
description: >-
  East West Bank is the California state-chartered commercial banking subsidiary
  of East West Bancorp, Inc. (NASDAQ EWBC), headquartered in Pasadena, California, with
  roughly $79.7 billion in total assets and more than 125 locations across the United States
  and Greater China. A Member FDIC institution and one of the few U.S. banks holding a full
  banking license in China, it specializes in cross-border U.S.-China commercial banking,
  treasury and Global Transaction Services (GTS). On the open-finance front, East West Bank
  runs a first-party developer portal ("Bridge Open Banking" at apiportal.eastwestbank.com)
  aimed at commercial clients, documenting APIs to manage sub-accounts, retrieve balances,
  transfer funds, and obtain commercial account information, with a sandbox of live test
  accounts; the program is early-stage ("more APIs coming soon") and gated behind sales
  onboarding, so no OpenAPI/Swagger is publicly downloadable. Consumer-permissioned data
  access is also available indirectly through the Plaid aggregator. No public FDX participation
  or CFPB Section 1033 posture is documented as of this profile.
