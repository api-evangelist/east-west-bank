aid: east-west-bank
name: East West Bank
review:
  question: Does East West Bank expose a public first-party developer API, and what is its
    open-finance posture (developer portal, downloadable specs, FDX/1033 participation,
    aggregator access, auth model)?
  answer: true
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    East West Bank (California state-chartered commercial bank; subsidiary of East West
    Bancorp, NASDAQ: EWBC; Member FDIC; ~$79.7B assets; cross-border U.S.-China focus)
    operates a live, first-party developer portal branded "Bridge Open Banking" at
    https://apiportal.eastwestbank.com/ (HTTP 200). It targets commercial / Global
    Transaction Services (GTS) clients and documents API capabilities to manage
    sub-accounts, retrieve balances, transfer funds, and obtain commercial account
    information, with a sandbox offering live test accounts and test payments. The program
    is early-stage: the /apis and /products pages both display "more APIs/products coming
    soon," and there are no publicly listed individual API products or endpoints. Reference
    material and specifications sit behind portal sign-in (https://apiportal.eastwestbank.com/signin,
    HTTP 200) and sales onboarding, so NO OpenAPI/Swagger definition is publicly
    downloadable and none was harvested. The developer subdomains developer.eastwestbank.com
    and developers.eastwestbank.com do not resolve; api.eastwestbank.com returns HTTP 403.
    The authentication model is not publicly documented, though the portal states developers
    create an application to obtain a single authentication credential (consistent with an
    OAuth2 / API-key application model on an IBM API Connect-style gateway). No public FDX
    (Financial Data Exchange) participation and no stated CFPB Section 1033 posture were
    found. Consumer-permissioned data access is available indirectly through the Plaid
    aggregator (per OpenBankingTracker). An official GitHub organization exists at
    github.com/eastwestbank (HTTP 200) but has 0 public repositories.
