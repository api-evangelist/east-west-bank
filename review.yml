  reason: |
    A real, live first-party developer portal was confirmed (HTTP 200) and one documented
    API program (Bridge Open Banking commercial API) was recorded as a single apis[] entry
    with its real human documentation URLs. No OpenAPI/Swagger is publicly downloadable
    (gated behind sign-in and sales onboarding), so openapi/ remains empty and nothing was
    harvested. No FDX participation or Section 1033 posture is documented; Plaid provides
    indirect aggregator access.
